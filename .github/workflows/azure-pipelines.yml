name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.CONEXION_AZURE_FRONT_END_STATICWEBAPP }}
          repo_token:                ${{ secrets.GITHUB_TOKEN }}
          action:                    upload
          app_location:              "/"      # tu código estático en la raíz
          api_location:              ""       # vacío si no usas Azure Functions
          output_location:           ""       # vacío si no hay carpeta de build
          skip_app_build:            true     # true si no necesitas paso de build

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.CONEXION_AZURE_FRONT_END_STATICWEBAPP }}
          action:                    close
